# vim:fileencoding=utf-8:foldmethod=marker

clear_all_shortcuts yes
kitty_mod alt+shift
map_timeout 0.0

enabled_layouts fat:bias=70;full_size=1;mirrored=false, tall:bias=50;full_size=1;mirrored=false, stack



# layout modification
map alt+space>n next_layout
map alt+n next_layout
map alt+space>m move_window_to_top
map alt+m move_window_to_top
action_alias layout_resize layout_action bias 50 60 70 80
map alt+r layout_resize
map alt+space>r layout_resize
map alt+f toggle_layout stack
map alt+space>f toggle_layout stack

# scrolling
map --new-mode --timeout 0.0 scroll alt+space>s
map --new-mode scroll alt+s
map --mode scroll esc pop_keyboard_mode

# windows focus
map alt+space>j neighboring_window down
map alt+j neighboring_window down
map alt+space>k neighboring_window up
map alt+k neighboring_window up
map alt+space>h neighboring_window left
map alt+h neighboring_window left
map alt+space>l neighboring_window right
map alt+l neighboring_window right

map alt+space>u next_window
map alt+u next_window
map alt+space>i previous_window
map alt+i previous_window
map alt+space>. focus_visible_window
map alt+. focus_visible_window

#window modification
#map alt+space>enter new_window
#map alt+enter new_window
action_alias split_window launch --cwd=current
map alt+space>enter split_window
map alt+enter split_window
map alt+space>u close_window
map alt+q close_window

map alt+space>y swap_with_window
map alt+y swap_with_window

#tab focus
map alt+space>shift+. select_tab
map alt+shift+. select_tab
map alt+space>shift+l next_tab
map alt+shift+l next_tab
map alt+space>shift+h previous_tab
map alt+shift+h previous_tab

#tab modify
# map alt+space>c new_tab
# map alt+c new_tab
map alt+space>c launch --cwd=current --type=tab
map alt+c launch --cwd=current --type=tab
map alt+space>shift+q close_tab
map alt+shift+q close_tab
tab_switch_strategy left

# map alt+space>, set_tab_title
action_alias tab_title launch --type overlay --allow-remote-control sh -c "vipe | xargs kitten @ set-tab-title"
map alt+space>, tab_title
map alt+, tab_title

map alt+ctrl+shift+h move_tab_backward
map alt+ctrl+shift+l move_tab_forward

#detach
map alt+space>d detach_window ask
map alt+d detach_window ask
map alt+space>shift+d detach_tab ask
map alt+shift+d detach_tab ask

#command palette
map alt+space>alt+space command_palette
map alt+? command_palette
map alt+space>? command_palette

# Copy Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# scrolling
map --new-mode --timeout 0.0 scroll alt+space>s
map --new-mode scroll alt+s
map --mode scroll esc pop_keyboard_mode
map --mode scroll q pop_keyboard_mode

map --mode scroll k scroll_line_up smooth
map --mode scroll j scroll_line_down smooth
map --mode scroll shift+k scroll_page_up
map --mode scroll shift+j scroll_page_down
map --mode scroll g>g scroll_home
map --mode scroll shift+g scroll_end

map --mode scroll / search_scrollback

map --mode scroll y>y combine : pop_keyboard_mode : launch --type=overlay --stdin-source=@last_cmd_output nvim -R
map --mode scroll shift+y combine : pop_keyboard_mode : launch --type=overlay --stdin-source=@screen nvim -R
map --mode scroll y>a combine : pop_keyboard_mode : launch --type=overlay --stdin-source=@screen_scrollback nvim -R

map alt+0 change_font_size current +1.0
map alt+= change_font_size current 0
map alt+} change_font_size current -1.0

# BEGIN_KITTY_THEME
# Night Lion V1
include current-theme.conf
# END_KITTY_THEME
background_opacity 0.8

tab_bar_edge top
tab_bar_style slant

# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
